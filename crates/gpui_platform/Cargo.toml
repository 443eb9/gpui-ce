[package]
name = "gpui_platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"

[features]
default = []
# Backend features are explicit because Cargo features cannot disable dependencies.
native = ["dep:gpui_linux", "dep:gpui_macos", "dep:gpui_windows"]
font-kit = ["gpui_macos?/font-kit"]
test-support = ["gpui/test-support", "gpui_macos?/test-support"]
screen-capture = [
  "gpui/screen-capture",
  "gpui_macos?/screen-capture",
  "gpui_windows?/screen-capture",
  "gpui_linux?/screen-capture",
]
runtime_shaders = ["gpui_macos?/runtime_shaders"]
wayland = ["gpui_linux?/wayland"]
x11 = ["gpui_linux?/x11"]
wgpu = ["gpui_windows?/wgpu"]
winit = ["dep:gpui_winit"]

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { optional = true, workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_winit = { optional = true, workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { optional = true, workspace = true }
gpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_linux = { optional = true, workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true
console_error_panic_hook = "0.1.7"
